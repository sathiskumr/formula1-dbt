version: 2

models:
  - name: bronze_drivers
    columns:
      - name: driverId
        data_tests:
          - not_null

  - name: bronze_constructors
    columns:
      - name: constructorId
        data_tests:
          - not_null

  - name: bronze_circuits
    columns:
      - name: circuitId
        data_tests:
          - not_null:
              config: {severity: warn}
              
  - name: bronze_races
    columns:
      - name: season
        data_tests:
          - not_null
      - name: round
        data_tests:
          - not_null

  - name: bronze_results
    columns:
      - name: season
        data_tests:
          - not_null:
              config: {severity: warn}
      - name: round
        data_tests:
          - not_null:
              config: {severity: warn}

  - name: bronze_sprints
    columns:
      - name: season
        data_tests:
          - not_null:
              config: {severity: warn}
      - name: round
        data_tests:
          - not_null:
              config: {severity: warn}