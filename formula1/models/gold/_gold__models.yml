models:

  - name: dim_drivers
    description: One row per driver, enriched with nationality region.

    config:
      contract: {enforced: true}

    columns:
      - name: driver_id
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          - not_null:
              config: {severity: error}
          - unique:
              config: {severity: error}

      - name: driver_name
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          - not_null:
              config: {severity: warn}

      - name: date_of_birth
        data_type: date

      - name: nationality
        data_type: string
        data_tests:
          - not_null:
              config: {severity: warn}

      - name: nationality_region
        data_type: string

      - name: created_timestamp
        data_type: timestamp

      - name: updated_timestamp
        data_type: timestamp

  - name: dim_constructors
    description: One row per constructor (team), cleansed and deduplicated.

    config:
      contract: {enforced: true}

    columns:
      - name: constructor_id
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          - not_null:
              config: {severity: error}
          - unique:
              config: {severity: error}

      - name: constructor_name
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          - not_null:
              config: {severity: warn}

      - name: nationality
        data_type: string
        data_tests:
          - not_null:
              config: {severity: warn}

      - name: nationality_region
        data_type: string

      - name: created_timestamp
        data_type: timestamp

      - name: updated_timestamp
        data_type: timestamp

  - name: dim_races
    description: Denormalized race dimension (race + circuit attributes), one row per season/round.

    config:
      contract: {enforced: true}
    
    columns:
      - name: season
        data_type: int
        data_tests:
          - not_null:
              config: {severity: error}

      - name: round
        data_type: int
        data_tests:
          - not_null:
              config: {severity: error}

      - name: race_name
        data_type: string

      - name: race_date
        data_type: date

      - name: circuit_name
        data_type: string
        data_tests:
          - not_null

      - name: locality
        data_type: string

      - name: country
        data_type: string
        
      - name: created_timestamp
        data_type: timestamp

      - name: updated_timestamp
        data_type: timestamp

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, round]
          config: {severity: error}