models:

  - name: dim_drivers
    description: One row per driver, enriched with nationality region.

    config:
      contract: {enforced: true}

    columns:
      - name: driver_id
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          - not_null:
              config: {severity: error}
          - unique:
              config: {severity: error}

      - name: driver_name
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          - not_null:
              config: {severity: warn}

      - name: date_of_birth
        data_type: date

      - name: nationality
        data_type: string
        data_tests:
          - not_null:
              config: {severity: warn}

      - name: nationality_region
        data_type: string

      - name: created_timestamp
        data_type: timestamp

      - name: updated_timestamp
        data_type: timestamp

  - name: dim_constructors
    description: One row per constructor (team), cleansed and deduplicated.

    config:
      contract: {enforced: true}

    columns:
      - name: constructor_id
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          - not_null:
              config: {severity: error}
          - unique:
              config: {severity: error}

      - name: constructor_name
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          - not_null:
              config: {severity: warn}

      - name: nationality
        data_type: string
        data_tests:
          - not_null:
              config: {severity: warn}

      - name: nationality_region
        data_type: string

      - name: created_timestamp
        data_type: timestamp

      - name: updated_timestamp
        data_type: timestamp