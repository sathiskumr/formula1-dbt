unit_tests:
  - name: test_silver_drivers__dedup_keeps_latest_batch
    description: Two rows for the same driver_id from different batches should collapse to the one with the highest batch_id.
    model: silver_drivers
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('bronze_drivers')
        format: sql
        rows: |
          select 'verstappen' as driverId, named_struct('givenName', 'Max', 'familyName', 'Verstappen') as name,
                 date('1997-09-30') as dateOfBirth, 'Dutch' as nationality,
                 timestamp('2024-01-01 00:00:00') as ingestion_timestamp, 'batch_001.json' as source_file, '2024_01' as batch_id
          union all
          select 'verstappen' as driverId, named_struct('givenName', 'Max', 'familyName', 'Verstappen') as name,
                 date('1997-09-30') as dateOfBirth, 'Dutch' as nationality,
                 timestamp('2024-02-01 00:00:00') as ingestion_timestamp, 'batch_002.json' as source_file, '2024_02' as batch_id
    expect:
      rows:
        - {driver_id: 'verstappen', driver_name: 'Max Verstappen', batch_id: '2024_02'}

  - name: test_silver_results__malformed_row_filtered_out
    description: A results row missing driver_id should be dropped by the `valid` CTE, not propagated with a null key.
    model: silver_results
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('bronze_results')
        format: sql
        rows: |
          select 2024 as season, 1 as round, 'red_bull' as constructorId, 'verstappen' as driverId,
                date('2024-03-02') as date, 'Bahrain GP' as raceName, 1 as grid, 57 as laps,
                1 as number, 25.0 as points, 1 as position, '1' as positionText, 'Finished' as status,
                timestamp('2024-03-03 00:00:00') as ingestion_timestamp, 'batch.json' as source_file, '2024_01' as batch_id
          union all
          select 2024 as season, 1 as round, 'ferrari' as constructorId, null as driverId,
                date('2024-03-02') as date, 'Bahrain GP' as raceName, 3 as grid, 57 as laps,
                55 as number, 0.0 as points, null as position, null as positionText, 'DNS' as status,
                timestamp('2024-03-03 00:00:00') as ingestion_timestamp, 'batch.json' as source_file, '2024_01' as batch_id
    expect:
      rows:
        - {driver_id: 'verstappen', constructor_id: 'red_bull'}

  - name: test_silver_results__dedup_keeps_latest_batch
    description: Two rows for the same (season, round, constructor_id, driver_id) from different batches should collapse to the highest batch_id.
    model: silver_results
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('bronze_results')
        format: sql
        rows: |
          select 2024 as season, 1 as round, 'red_bull' as constructorId, 'verstappen' as driverId,
                 date('2024-03-02') as date, 'Bahrain GP' as raceName, 1 as grid, 55 as laps,
                 1 as number, 18.0 as points, 3 as position, '3' as positionText, 'Finished' as status,
                 timestamp('2024-03-03 00:00:00') as ingestion_timestamp, 'batch_001.json' as source_file, '2024_01' as batch_id
          union all
          select 2024 as season, 1 as round, 'red_bull' as constructorId, 'verstappen' as driverId,
                 date('2024-03-02') as date, 'Bahrain GP' as raceName, 1 as grid, 57 as laps,
                 1 as number, 25.0 as points, 1 as position, '1' as positionText, 'Finished' as status,
                 timestamp('2024-03-04 00:00:00') as ingestion_timestamp, 'batch_002.json' as source_file, '2024_02' as batch_id
    expect:
      rows:
        - {driver_id: 'verstappen', final_position: 1, points: 25.0, batch_id: '2024_02'}