formula1:
  target: dev

  outputs:

    dev:
      type: databricks

      host: "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DBT_DATABRICKS_TOKEN') }}"

      catalog: formula1_dbt_dev
      schema: default

      threads: 1

    prod:
      type: databricks

      host: "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DBT_DATABRICKS_PROD_TOKEN') }}"

      catalog: formula1_dbt_prod
      schema: default

      threads: 4