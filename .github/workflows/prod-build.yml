name: Prod deploy (on merge to main / manual)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  build:
    name: dbt build (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DBT_DATABRICKS_HOST:       "${{ secrets.DBT_DATABRICKS_HOST }}"
      DBT_DATABRICKS_HTTP_PATH:  "${{ secrets.DBT_DATABRICKS_HTTP_PATH }}"
      DBT_DATABRICKS_PROD_TOKEN: "${{ secrets.DBT_DATABRICKS_PROD_TOKEN }}"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv python install 3.12
      - run: uv sync
      - run: cd formula1 && uv run dbt deps --profiles-dir _prod_profiles --target prod
      - name: dbt build
        run: cd formula1 && uv run dbt build --profiles-dir _prod_profiles --target prod
      - name: Upload prod target as artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-target
          path: formula1/target/
          retention-days: 90
      - name: Generate dbt docs (static)
        run: cd formula1 && uv run dbt docs generate --static --profiles-dir _prod_profiles --target prod
      - name: Prepare docs for Pages
        run: cp formula1/target/static_index.html formula1/target/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: formula1/target

  deploy-docs:
    name: Deploy dbt docs to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4