name: Dev CI (build on PR)

on:
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read
  actions: read

concurrency:
  group: dev-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: dbt build (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DBT_DATABRICKS_HOST:      "${{ secrets.DBT_DATABRICKS_HOST }}"
      DBT_DATABRICKS_HTTP_PATH: "${{ secrets.DBT_DATABRICKS_HTTP_PATH }}"
      DBT_DATABRICKS_TOKEN:     "${{ secrets.DBT_DATABRICKS_TOKEN }}"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv python install 3.12
      - run: uv sync
      - run: cd formula1 && uv run dbt deps --profiles-dir _prod_profiles --target dev
      - name: Download latest prod-target artifact from main
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: prod-build.yml
          branch: main
          name: prod-target
          path: formula1/prod-target
          workflow_conclusion: success
          if_no_artifact_found: fail
      - name: dbt build (slim CI)
        run: |
          cd formula1
          uv run dbt build --profiles-dir _prod_profiles --target dev \
            --select state:modified+ --defer --state ./prod-target